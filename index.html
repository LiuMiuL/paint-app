<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>그림판</title>
<meta name="description" content="손끝으로 그리는 그림판 — 펜, 붓, 연필, 형광펜, 도형, 채우기, 글자, 스포이트, 레이어, 자르기·회전·대칭·크기 조정, 확대/축소, 사진 위에 그리기, PNG 저장·공유. 설치 없이 바로 쓰는 PWA.">
<meta name="theme-color" content="#eef1f6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="그림판">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>그림판</h1>
    </div>
    <div class="actions">
      <button type="button" class="icon-btn" id="importBtn" aria-label="사진 불러오기" title="사진 불러오기 (Ctrl+O)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/>
          <path d="m4 17.5 4.6-4.6a1.6 1.6 0 0 1 2.3 0l1.6 1.6 2.6-2.6a1.6 1.6 0 0 1 2.3 0l3.1 3.1"/>
        </svg>
      </button>
      <input type="file" id="imageInput" accept="image/*" hidden>
      <button type="button" class="icon-btn" id="editBtn" aria-label="편집 — 회전·대칭·크기·레이어·배경색·확대" title="편집 (회전·대칭·크기·레이어·배경색·확대)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>
        </svg>
      </button>
      <span class="divider" aria-hidden="true"></span>
      <button type="button" class="icon-btn" id="undoBtn" aria-label="실행 취소" title="실행 취소 (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H12"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" id="redoBtn" aria-label="다시 실행" title="다시 실행 (Ctrl+Shift+Z)" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H12"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" id="clearBtn" aria-label="전체 지우기" title="전체 지우기 (Ctrl+Delete)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h16"/><path d="M10 11v6M14 11v6"/>
          <path d="m6.5 7 .9 12.1A2 2 0 0 0 9.4 21h5.2a2 2 0 0 0 2-1.9L17.5 7"/>
          <path d="M9.5 7V5.2A2.2 2.2 0 0 1 11.7 3h.6a2.2 2.2 0 0 1 2.2 2.2V7"/>
        </svg>
      </button>
      <button type="button" class="icon-btn" id="shareBtn" aria-label="공유하기" title="공유하기" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.5v11"/><path d="m7.5 8 4.5-4.5L16.5 8"/>
          <path d="M8 11.5H6.5a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2H16"/>
        </svg>
      </button>
      <button type="button" class="icon-btn primary" id="saveBtn" aria-label="PNG로 저장" title="PNG로 저장 (Ctrl+S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.5v11"/><path d="m7 10 5 5 5-5"/><path d="M4.5 20.5h15"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="wrap" id="wrap">
      <div class="layers" id="layers"></div>
      <canvas id="preview" aria-label="그림을 그리는 캔버스" role="img"></canvas>
      <input type="text" class="text-editor" id="textEditor" aria-label="넣을 글자" placeholder="글자 입력" enterkeyhint="done" autocomplete="off" spellcheck="false" hidden>
    </div>
    <button type="button" class="zoom-badge" id="zoomBadge" aria-label="확대 배율 — 눌러서 100%로" title="100%로 (0)" hidden>100%</button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <div class="palette-bar">
    <div class="swatches" id="swatches" role="group" aria-label="색상 팔레트"></div>
    <button type="button" class="color-chip" id="colorBtn" aria-label="색 직접 고르기 — HEX·RGB·HSV" title="색 직접 고르기 (HEX·RGB·HSV)"><span></span></button>
    <button type="button" class="opt-btn" id="shapeFillBtn" aria-pressed="false" aria-label="도형 안쪽 채우기" title="도형 안쪽 채우기 (F)" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true">
        <rect class="fill-mark" x="4.5" y="5.5" width="15" height="13" rx="2"/>
      </svg>
      <span>채움</span>
    </button>
    <div class="size-control">
      <span class="size-dot" id="sizeDot" aria-hidden="true"></span>
      <input type="range" id="sizeSlider" min="1" max="80" step="1" value="6" aria-label="붓 굵기">
      <output class="size-value" id="sizeValue" for="sizeSlider">6</output>
    </div>
  </div>

  <nav class="toolbar" id="toolbar" aria-label="도구">
    <button type="button" class="tool" data-tool="pen" aria-pressed="true" aria-label="펜" title="펜 (B)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20.2 8.2 19 18 9.2a2.6 2.6 0 0 0-3.7-3.7L4.6 15.3z"/><path d="m13 7 4 4"/>
      </svg>
      <span>펜</span>
    </button>
    <button type="button" class="tool" data-tool="brush" aria-pressed="false" aria-label="붓" title="붓 (U)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19.5 4.5 11 13"/><path d="m10 11.5 2.5 2.5"/><path d="M9.2 13.6c-2.2-.3-4 1.2-4.2 3.4-.1 1.2-.6 2.1-1.5 2.7 3.3.7 7.3-.2 8.1-3a2.7 2.7 0 0 0-2.4-3.1z"/>
      </svg>
      <span>붓</span>
    </button>
    <button type="button" class="tool" data-tool="pencil" aria-pressed="false" aria-label="연필" title="연필 (P)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m14.5 6 3.5 3.5"/><path d="M4 20l1-4.2L15.6 5.2a1.8 1.8 0 0 1 2.5 0l.7.7a1.8 1.8 0 0 1 0 2.5L8.2 19z"/><path d="m5 15.8 3.2 3.2"/>
      </svg>
      <span>연필</span>
    </button>
    <button type="button" class="tool" data-tool="highlighter" aria-pressed="false" aria-label="형광펜" title="형광펜 (H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.5 14.5 14 7l3.5 3.5-7.5 7.5H6.5z"/><path d="M14 7l1.2-1.2a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L17.5 10.5"/>
        <path d="M4 21h16" stroke-width="3.2" opacity=".45"/>
      </svg>
      <span>형광펜</span>
    </button>
    <button type="button" class="tool" data-tool="eraser" aria-pressed="false" aria-label="지우개" title="지우개 (E)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8.5 20.5H20"/><path d="m4.5 15.2 6.9-6.9a2 2 0 0 1 2.8 0l3 3a2 2 0 0 1 0 2.8l-4.6 4.6H8.6l-4.1-4.1z"/>
        <path d="m10 9.5 6 6"/>
      </svg>
      <span>지우개</span>
    </button>
    <button type="button" class="tool" data-tool="line" aria-pressed="false" aria-label="직선" title="직선 (L)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M6 18 18 6"/><circle cx="5" cy="19" r="1.8" fill="currentColor" stroke="none"/><circle cx="19" cy="5" r="1.8" fill="currentColor" stroke="none"/>
      </svg>
      <span>직선</span>
    </button>
    <button type="button" class="tool" data-tool="rect" aria-pressed="false" aria-label="사각형" title="사각형 (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4.5" y="6.5" width="15" height="11" rx="1.6"/>
      </svg>
      <span>사각형</span>
    </button>
    <button type="button" class="tool" data-tool="ellipse" aria-pressed="false" aria-label="원" title="원 (O)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="7.6"/>
      </svg>
      <span>원</span>
    </button>
    <button type="button" class="tool" data-tool="fill" aria-pressed="false" aria-label="채우기" title="채우기 (G)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5.6 11.2 11.8 5l6.6 6.6-5.3 5.3a2 2 0 0 1-2.8 0l-4.7-4.7a1 1 0 0 1 0-1z"/>
        <path d="m8.4 8.4-2.1-2.1"/><path d="M8 20.5h12"/>
        <path d="M19.6 13.4s1.6 2.1 1.6 3.1a1.6 1.6 0 0 1-3.2 0c0-1 1.6-3.1 1.6-3.1z"/>
      </svg>
      <span>채우기</span>
    </button>
    <button type="button" class="tool" data-tool="text" aria-pressed="false" aria-label="글자" title="글자 (T)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 7V5h14v2"/><path d="M12 5v14"/><path d="M9 19h6"/>
      </svg>
      <span>글자</span>
    </button>
    <button type="button" class="tool" data-tool="picker" aria-pressed="false" aria-label="스포이트 — 그림에서 색 고르기" title="스포이트 (I)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m14.5 6.5 3 3"/><path d="M16.2 4.4a2.1 2.1 0 0 1 3 3l-1.7 1.7-3-3z"/>
        <path d="m14.5 6.5-8.6 8.6a2 2 0 0 0-.5.9L4.5 19.5l3.5-.9a2 2 0 0 0 .9-.5l8.6-8.6"/>
      </svg>
      <span>스포이트</span>
    </button>
    <button type="button" class="tool" data-tool="crop" aria-pressed="false" aria-label="자르기 — 남길 영역을 끌어서 고르기" title="자르기 (C)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6.5 2.5V15a2 2 0 0 0 2 2h13"/><path d="M2.5 6.5H15a2 2 0 0 1 2 2v13"/>
      </svg>
      <span>자르기</span>
    </button>
  </nav>

</div>

<dialog class="sheet" id="colorDialog" aria-labelledby="colorTitle">
  <div class="sheet-body">
    <div class="sheet-head">
      <h2 id="colorTitle">색 고르기</h2>
      <button type="button" class="icon-btn" data-close aria-label="닫기" title="닫기 (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="color-top">
      <span class="color-preview" id="colorPreview" aria-hidden="true"></span>
      <label class="field">HEX <input type="text" id="hexInput" maxlength="7" autocomplete="off" spellcheck="false" aria-label="16진수 색상 코드"></label>
      <label class="native-color" title="기기 색 선택기">
        <input type="color" id="colorInput" value="#111827" aria-label="기기 색 선택기">
      </label>
    </div>
    <div class="sliders" id="colorSliders">
      <p class="group-label">RGB</p>
      <label>R <input type="range" data-ch="r" min="0" max="255" aria-label="빨강 0~255"><output></output></label>
      <label>G <input type="range" data-ch="g" min="0" max="255" aria-label="초록 0~255"><output></output></label>
      <label>B <input type="range" data-ch="b" min="0" max="255" aria-label="파랑 0~255"><output></output></label>
      <p class="group-label">HSV</p>
      <label>H <input type="range" data-ch="h" min="0" max="360" aria-label="색상 0~360도"><output></output></label>
      <label>S <input type="range" data-ch="s" min="0" max="100" aria-label="채도 0~100%"><output></output></label>
      <label>V <input type="range" data-ch="v" min="0" max="100" aria-label="명도 0~100%"><output></output></label>
    </div>
  </div>
</dialog>

<dialog class="sheet" id="editDialog" aria-labelledby="editTitle">
  <div class="sheet-body">
    <div class="sheet-head">
      <h2 id="editTitle">편집</h2>
      <button type="button" class="icon-btn" data-close aria-label="닫기" title="닫기 (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <p class="group-label">보기</p>
    <div class="btn-row">
      <button type="button" class="chip-btn" data-act="zoom-out" title="축소 (-)">축소 −</button>
      <button type="button" class="chip-btn" data-act="zoom-reset" title="100% (0)">100%</button>
      <button type="button" class="chip-btn" data-act="zoom-in" title="확대 (+)">확대 +</button>
    </div>

    <p class="group-label">변형 <small>모든 레이어에 적용 · 실행 취소 가능</small></p>
    <div class="btn-row">
      <button type="button" class="chip-btn" data-act="rot-left">왼쪽 90°</button>
      <button type="button" class="chip-btn" data-act="rot-right">오른쪽 90°</button>
      <button type="button" class="chip-btn" data-act="flip-x">좌우 대칭</button>
      <button type="button" class="chip-btn" data-act="flip-y">상하 대칭</button>
      <button type="button" class="chip-btn" data-act="crop" title="자르기 (C)">자르기</button>
    </div>

    <p class="group-label">크기 조정</p>
    <div class="btn-row">
      <select id="resizeUnit" aria-label="단위">
        <option value="px">픽셀</option>
        <option value="pct">비율(%)</option>
      </select>
      <input type="number" id="resizeW" min="1" inputmode="numeric" aria-label="가로">
      <span aria-hidden="true">×</span>
      <input type="number" id="resizeH" min="1" inputmode="numeric" aria-label="세로">
      <label class="check"><input type="checkbox" id="resizeLock" checked> 비율 유지</label>
      <button type="button" class="chip-btn primary" data-act="resize">적용</button>
    </div>

    <p class="group-label">배경색</p>
    <div class="btn-row">
      <label class="native-color" title="배경색"><input type="color" id="bgInput" value="#ffffff" aria-label="배경색"></label>
      <small>바꾸면 바로 적용돼요 · 실행 취소 가능</small>
    </div>

    <p class="group-label">레이어 <small>위에 있는 레이어가 앞에 보여요</small></p>
    <div class="layer-list" id="layerList"></div>
    <div class="btn-row">
      <button type="button" class="chip-btn" data-act="layer-add">+ 새 레이어</button>
    </div>

    <p class="group-label">화면</p>
    <div class="btn-row">
      <select id="themeSelect" aria-label="화면 테마">
        <option value="auto">자동 (기기 설정)</option>
        <option value="light">밝게</option>
        <option value="dark">어둡게 (다크 모드)</option>
      </select>
    </div>
  </div>
</dialog>

<noscript>그림판을 쓰려면 브라우저에서 자바스크립트를 허용해 주세요.</noscript>
<script src="./app.js"></script>
</body>
</html>
